# User-editable common blocks. Hardware blocks are generated at bar startup.
separator=true
separator_block_width=12
[network]
command=abs-status network
interval=5
[audio]
command=abs-status audio
interval=5
[disk]
command=df -h / | awk 'NR == 2 {print "Disk " $4 " free"}'
interval=60
[memory]
command=free -m | awk '/^Mem:/ {printf "RAM %.1fG/%.1fG\n", $3/1024, $2/1024}'
interval=10
[screenshot]
command=abs-status screenshot
interval=once
[time]
command=date '+%a %d %b %H:%M'
interval=30
